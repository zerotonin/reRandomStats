[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rerandomstats"
version = "0.2.0"
description = "Re-randomisation statistics toolkit: Fisher's resampling test, multi-group comparisons with shared-core FDR / Bonferroni / Holm correction, binomial proportion tests, classical hypothesis-test dispatcher, time-stratified case-crossover estimators, model-comparison helpers (Wald two-sample-beta, LRT), and dose-response / breakpoint analysis (broken-stick + Davies + Muggeo pscore + 4PL Hill with profile-RSS CIs and Sebaugh-McCray lower bend)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Bart R.H. Geurten", email = "bart.geurten@otago.ac.nz"},
]
keywords = [
    "statistics",
    "resampling",
    "permutation-test",
    "Fisher",
    "hypothesis-testing",
    "FDR",
    "Benjamini-Hochberg",
    "Bonferroni",
    "binomial",
    "non-parametric",
    "case-crossover",
    "conditional-logit",
    "Wald-test",
    "likelihood-ratio-test",
    "dose-response",
    "broken-stick-regression",
    "Davies-test",
    "Hill-equation",
    "breakpoint-detection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "pandas>=1.5",
    "statsmodels>=0.13",
    "prettytable>=3.0",
    "tqdm>=4.60",
]

[project.urls]
Homepage = "https://github.com/zerotonin/reRandomStats"
Documentation = "https://zerotonin.github.io/reRandomStats/"
Repository = "https://github.com/zerotonin/reRandomStats"
Issues = "https://github.com/zerotonin/reRandomStats/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["rerandomstats*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 99
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
